; SLWF-12 AC Bridge — PlatformIO project configuration
; Hardware: SLWF-12 r1.0 (ESP8266 / ESP-12F, 4 MB flash, CH340N USB-UART)
;
; Flash layout (eagle.flash.4m2m.ld):
;   0x000000  ~1019 KB  application slot
;   ~1 MB     ~1 MB     OTA scratch (must be >= application size)
;   0x200000   2048 KB  LittleFS  (web UI, language packs, learned IR codes, config)

[platformio]
default_envs = slwf12
description = Universal IR air-conditioner bridge for the SLWF-12 (ESP8266)

; ---------------------------------------------------------------------------
; Shared settings
; ---------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17
    -Wall
    ; --- board pin defaults (all runtime-overridable from the web UI) --------
    -D PIN_IR_RX=4                 ; J2 pin 1  — IR receiver module output
    -D PIN_IR_TX=16                ; Q3 gate   — IR emitter LED driver
    -D PIN_IR_TX_ALT=13            ; Q2 gate   — "IR_Write" driver to pad P2
    -D PIN_BUTTON=0                ; U6        — user / reset button (active low)
    -D PIN_STATUS_LED=-1           ; no dedicated indicator LED on SLWF-12
    ; --- framework tuning ----------------------------------------------------
    -D NDEBUG
    -D ATOMIC_FS_UPDATE            ; safe OTA of the LittleFS image
    -D BEARSSL_SSL_BASIC           ; smaller TLS build (Telegram fits in heap)
    -D VTABLES_IN_FLASH
    -D MQTT_MAX_PACKET_SIZE=1280   ; Home Assistant discovery payloads
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
    ; --- IRremoteESP8266 -----------------------------------------------------
    -D DECODE_HASH=true
    -D _IR_LOCALE_=en-AU
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_src_flags =
    -Wextra
    -Wno-unused-parameter
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8
    esphome/ESPAsyncTCP-esphome@^2.0.0
    esphome/ESPAsyncWebServer-esphome@^3.2.2
    emelianov/modbus-esp8266@^4.1.0

; ---------------------------------------------------------------------------
; Production build
; ---------------------------------------------------------------------------
[env:slwf12]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L        ; 160 MHz — IR capture timing headroom

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed = 921600

; lwIP "low memory" variant: ~10 KB more heap, which BearSSL needs for Telegram.
board_build.lwip_variant = v2_low_memory

build_flags =
    ${common.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -Os
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}
lib_deps = ${common.lib_deps}
lib_ldf_mode = deep+

extra_scripts =
    pre:tools/gen_version.py
    pre:tools/build_web.py
    ; Builds the filesystem image and the merged factory image too, so one
    ; `pio run` leaves all three flashable files in .pio/build/slwf12.
    post:tools/package.py

; ---------------------------------------------------------------------------
; Development build — verbose logging, no OTA compression, faster iteration
; ---------------------------------------------------------------------------
[env:slwf12-debug]
extends = env:slwf12
build_type = debug
build_flags =
    ${env:slwf12.build_flags}
    -D SLWF12_DEBUG=1
    -D DEBUG_ESP_PORT=Serial
    -D DEBUG_ESP_CORE

; ---------------------------------------------------------------------------
; OTA upload target. Usage:
;   pio run -e slwf12-ota -t upload --upload-port 192.168.1.50
; ---------------------------------------------------------------------------
[env:slwf12-ota]
extends = env:slwf12
upload_protocol = espota
upload_flags =
    --port=8266
